name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DotnetAiEvaluationDemo.sln
      - name: Build
        run: dotnet build DotnetAiEvaluationDemo.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DotnetAiEvaluationDemo.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
